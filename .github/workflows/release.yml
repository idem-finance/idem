name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  sign-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The tagged commit is only ever cut from a main commit that already passed
      # the full CI verify (tests + JaCoCo). Require that green run so we can skip
      # re-testing here; fail loudly if the tag points at an untested commit.
      - name: Require green CI on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion=$(gh run list --repo "${{ github.repository }}" \
            --commit "$GITHUB_SHA" --workflow CI --json conclusion --jq '.[0].conclusion')
          if [ "$conclusion" != "success" ]; then
            echo "::error::Tagged commit $GITHUB_SHA has no successful CI run (got: '${conclusion:-none}'). Tag a commit that passed CI on main."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Set release version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./mvnw --no-transfer-progress versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      # Tests already ran on this commit in CI (guarded above); package + sign only.
      - name: Build and sign artifacts
        run: ./mvnw --no-transfer-progress -P release verify -DskipTests
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: signed-jars
          path: |
            **/target/*.jar
            **/target/*.jar.asc
          if-no-files-found: error
          # Intra-run handoff to publish-central/create-release only — not a deliverable.
          # Short retention prevents multi-GB accumulation that exhausts the storage quota.
          retention-days: 1

  publish-central:
    needs: sign-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21 with Central credentials
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: SONATYPE_USERNAME
          server-password: SONATYPE_PASSWORD

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Set release version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./mvnw --no-transfer-progress versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Publish idem-core and idem-sdk-kotlin to Maven Central
        run: ./mvnw --no-transfer-progress -P release deploy -pl core,sdk-kotlin -DskipTests
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  publish-and-sign-image:
    needs: sign-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download signed jars
        uses: actions/download-artifact@v6
        with:
          name: signed-jars
          path: signed-jars

      - name: Stage the signed boot jar
        run: |
          jar=$(ls signed-jars/app/target/app-*.jar)
          [ -f "$jar" ] || { echo "::error::signed boot jar not found under signed-jars/app/target"; exit 1; }
          cp "$jar" app.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/idem-finance/idem
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test image
        run: |
          ref="ghcr.io/idem-finance/idem@${{ steps.push.outputs.digest }}"
          timeout 90 docker run --rm "$ref" > boot.log 2>&1 || true
          grep -q "Starting IdemApplication" boot.log \
            || { echo "::error::published image did not reach Spring Boot startup"; cat boot.log; exit 1; }

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: |
          cosign sign --yes \
            ghcr.io/idem-finance/idem@${{ steps.push.outputs.digest }}

      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/idem-finance/idem/.github/workflows/release.yml@refs/tags/" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ghcr.io/idem-finance/idem@${{ steps.push.outputs.digest }}

  publish-dockerhub-jvm:
    needs: sign-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download signed jars
        uses: actions/download-artifact@v6
        with:
          name: signed-jars
          path: signed-jars

      - name: Stage the signed boot jar
        run: |
          jar=$(ls signed-jars/app/target/app-*.jar)
          [ -f "$jar" ] || { echo "::error::signed boot jar not found under signed-jars/app/target"; exit 1; }
          cp "$jar" app.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: id3mfin4nc3/idem
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push JVM image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test image
        run: |
          ref="id3mfin4nc3/idem@${{ steps.push.outputs.digest }}"
          timeout 90 docker run --rm "$ref" > boot.log 2>&1 || true
          grep -q "Starting IdemApplication" boot.log \
            || { echo "::error::published image did not reach Spring Boot startup"; cat boot.log; exit 1; }

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: |
          cosign sign --yes \
            id3mfin4nc3/idem@${{ steps.push.outputs.digest }}

      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/idem-finance/idem/.github/workflows/release.yml@refs/tags/" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            id3mfin4nc3/idem@${{ steps.push.outputs.digest }}

  publish-dockerhub-native:
    needs: sign-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Set release version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./mvnw --no-transfer-progress versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: id3mfin4nc3/idem
          flavor: |
            latest=false
          tags: |
            type=raw,value=native
            type=semver,pattern=native-{{version}}

      - name: Build native builder stage (local, for binary extraction)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.native
          target: builder
          push: false
          load: true
          tags: idem-native-builder:tmp
          cache-from: type=gha,scope=native-image
          cache-to: type=gha,mode=max,scope=native-image

      - name: Extract native binary
        run: |
          docker create --name extract-native idem-native-builder:tmp
          docker cp extract-native:/workspace/app/target/idem ./idem-native-linux-amd64
          docker rm extract-native

      - name: Upload native binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-binary
          path: idem-native-linux-amd64
          if-no-files-found: error
          # Intra-run handoff to create-release only — not a deliverable.
          # Short retention prevents multi-GB accumulation that exhausts the storage quota.
          retention-days: 1

      - name: Build and push native image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.native
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=native-image

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: |
          cosign sign --yes \
            id3mfin4nc3/idem@${{ steps.push.outputs.digest }}

      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/idem-finance/idem/.github/workflows/release.yml@refs/tags/" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            id3mfin4nc3/idem@${{ steps.push.outputs.digest }}

  create-github-release:
    needs:
      - sign-artifacts
      - publish-central
      - publish-and-sign-image
      - publish-dockerhub-jvm
      - publish-dockerhub-native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Download signed jars
        uses: actions/download-artifact@v6
        with:
          name: signed-jars
          path: signed-jars

      - name: Download native binary
        uses: actions/download-artifact@v6
        with:
          name: native-binary
          path: native-binary

      - name: Generate SHA256 checksums
        run: |
          find signed-jars -type f \( -name '*.jar' -o -name '*.jar.asc' \) | sort | xargs sha256sum > checksums.txt
          sha256sum native-binary/idem-native-linux-amd64 >> checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            signed-jars/**/*.jar
            signed-jars/**/*.jar.asc
            native-binary/idem-native-linux-amd64
            checksums.txt
          generate_release_notes: true
