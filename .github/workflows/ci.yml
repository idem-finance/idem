name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

# Cancel superseded runs on PR branches; never cancel main builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Fast-fail lint before the full build. Source-only checks — no compilation
      # needed; `initialize` stages the ktlint/detekt CLI jars into target/tools.
      # Both checks also run (and are enforced) again as part of `verify`.
      - name: Lint (fast fail)
        run: ./mvnw initialize antrun:run@ktlint-check antrun:run@detekt-check --no-transfer-progress

      - name: Build, lint, test, coverage
        run: ./mvnw verify --no-transfer-progress
