name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read
  security-events: write
  actions: read

# Cancel superseded runs on PR branches; never cancel main builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # ktlint + detekt are bound to the verify phase (failonerror=true), so this
      # single invocation builds, lints, tests, and enforces coverage.
      - name: Build, lint, test, coverage
        run: ./mvnw verify --no-transfer-progress

      - name: Upload Detekt SARIF (core)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: core/target/detekt.sarif
          category: detekt-core

      - name: Upload Detekt SARIF (application)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: application/target/detekt.sarif
          category: detekt-application

      - name: Upload Detekt SARIF (infrastructure)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: infrastructure/target/detekt.sarif
          category: detekt-infrastructure

      - name: Upload Detekt SARIF (api)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: api/target/detekt.sarif
          category: detekt-api

      - name: Upload Detekt SARIF (mcp)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: mcp/target/detekt.sarif
          category: detekt-mcp

      - name: Upload Detekt SARIF (sdk-kotlin)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sdk-kotlin/target/detekt.sarif
          category: detekt-sdk-kotlin

      - name: Upload Detekt SARIF (app)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: app/target/detekt.sarif
          category: detekt-app
