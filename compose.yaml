services:

  postgres:
    image: postgres:16
    container_name: idem-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: idem_dev
      POSTGRES_USER: idem
      POSTGRES_PASSWORD: idem
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idem -d idem_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: idem-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Run with: docker compose --profile app up -d
  # Pulls and runs the published image (idemfinance/idem:latest) by default.
  # Set IDEM_VERSION to pin a version, e.g. IDEM_VERSION=0.1.0.
  # To build from local source instead, layer the override file:
  #   docker compose -f compose.yaml -f compose.build.yaml --profile app up -d --build
  app:
    image: idemfinance/idem:${IDEM_VERSION:-latest}
    container_name: idem-app
    profiles:
      - app
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/idem_dev
      SPRING_DATASOURCE_USERNAME: idem
      SPRING_DATASOURCE_PASSWORD: idem
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres-data:
