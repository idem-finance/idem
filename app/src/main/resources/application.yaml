spring:
  application:
    name: idem
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith,metrics

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%15.15t] traceId=%X{traceId} %-40.40logger{39} : %m%n%wEx"

idem:
  scheduling:
    distributed-lock:
      # Off by default for standalone single-instance deployments.
      # Set IDEM_SCHEDULING_DISTRIBUTED_LOCK_ENABLED=true in cloud/GKE multi-replica environments.
      enabled: false
  audit:
    # Must be set to a strong secret in production — rotate via secret manager
    hmac-secret: "${IDEM_AUDIT_HMAC_SECRET:}"
  chain:
    evm:
      rpc-url: "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY:}"
    evm-base:
      rpc-url: "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY:}"
    evm-polygon:
      rpc-url: "https://polygon-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY:}"
    solana:
      rpc-url: "${QUICKNODE_SOLANA_URL:}"
      batch-size: 100
    quicknode-webhook-secret: "${QUICKNODE_WEBHOOK_SECRET:}"
    tron:
      api-url: https://apilist.tronscan.org
      api-key: "${TRONSCAN_API_KEY:}"
      polling-interval-ms: 5000
  reconciliation:
    enabled: true
    matching-window-hours: 24
  webhook:
    timeout-ms: 5000
    # RetrySchedule supports 1-5 (5s/30s/2m/10m backoff, then DEAD); WebhookOutboxPoller
    # fails fast at startup if this is set outside that range.
    max-attempts: 5
    batch-size: 50
    poll-interval-ms: 5000

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/idem_dev
    username: idem
    password: idem
