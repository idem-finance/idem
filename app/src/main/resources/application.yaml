spring:
  application:
    name: idem
  ai:
    mcp:
      server:
        name: idem-ledger
        version: 0.1.0
        transport: sse
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 8081

springdoc:
  paths-to-exclude: /internal/**
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith,metrics

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%15.15t] traceId=%X{traceId} %-40.40logger{39} : %m%n%wEx"

idem:
  scheduling:
    distributed-lock:
      # Off by default for standalone single-instance deployments.
      # Set IDEM_SCHEDULING_DISTRIBUTED_LOCK_ENABLED=true in cloud/GKE multi-replica environments.
      enabled: false
  audit:
    # Must be set to a strong secret in production — rotate via secret manager
    hmac-secret: "${IDEM_AUDIT_HMAC_SECRET:}"
  chain:
    evm:
      rpc-url: "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY:}"
    evm-base:
      rpc-url: "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY:}"
    evm-polygon:
      rpc-url: "https://polygon-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY:}"
    solana:
      rpc-url: "${QUICKNODE_SOLANA_URL:}"
      batch-size: 100
    alchemy-webhook-signing-key: "${ALCHEMY_WEBHOOK_SIGNING_KEY:}"
    quicknode-webhook-secret: "${QUICKNODE_WEBHOOK_SECRET:}"
    tron:
      api-url: https://apilist.tronscan.org
      api-key: "${TRONSCAN_API_KEY:}"
      polling-interval-ms: 5000
  reconciliation:
    enabled: true
    matching-window-hours: 24
  webhook:
    timeout-ms: 5000
    # RetrySchedule supports 1-5 (5s/30s/2m/10m backoff, then DEAD); WebhookOutboxPoller
    # fails fast at startup if this is set outside that range.
    max-attempts: 5
    batch-size: 50
    poll-interval-ms: 5000
  telemetry:
    # Set to false to opt out entirely — no network calls are made when disabled.
    enabled: true
    endpoint: https://telemetry.idem.finance/ping
    # Cron: every Monday at 01:00 UTC. Override for testing (e.g. "0 * * * * *").
    cron: "0 0 1 * * MON"
  limits:
    # Log an INFO nudge when self-hosted tenant count exceeds this value. Set to -1 to disable.
    soft-warn-threshold: 10
  tenant-config:
    cache-ttl-minutes: 10
  usage-metering:
    # Cron: 5 minutes past every hour, giving the safety buffer below room before the hour
    # it's rolling up is considered fully elapsed. Override for testing (e.g. "0 * * * * *").
    rollup-cron: "0 5 * * * *"
    rollup-safety-buffer-minutes: 5
    # Bounds a single run's catch-up so a large backlog can't outrun the 10-minute
    # @SchedulerLock lease — see UsageMetricsRollupJob KDoc.
    rollup-max-hours-per-run: 120
    api-call-flush-interval-ms: 60000
  admin:
    # Blank by default — self-hosted installs never call /internal/admin/tenants/**, and a
    # blank token makes the admin-token check fail closed rather than requiring this to be
    # set just to start the app (unlike idem.audit.hmac-secret, which every install uses).
    token: "${IDEM_ADMIN_TOKEN:}"
  dashboard:
    base-url: "${IDEM_DASHBOARD_BASE_URL:https://cloud.idem.finance}"
  email:
    # Blank by default — welcome-email delivery is best-effort; see ResendEmailAdapter.
    resend-api-key: "${RESEND_API_KEY:}"
    from-address: "${IDEM_EMAIL_FROM:noreply@idem.finance}"

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/idem_dev
    username: idem
    password: idem

idem:
  audit:
    # Dev-only fallback — never use in production; set IDEM_AUDIT_HMAC_SECRET instead
    hmac-secret: "dev-only-insecure-hmac-secret"
  webhook:
    # Allow http:// in local dev so tenant webhook receivers can run on plain localhost
    require-https: false
