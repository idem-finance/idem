management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith,metrics

spring:
  jpa:
    open-in-view: false

idem:
  audit:
    # Non-blank test-only value so @NotBlank on AuditProperties doesn't fail @SpringBootTest startup.
    # Production must set IDEM_AUDIT_HMAC_SECRET via secret manager.
    hmac-secret: "test-only-insecure-hmac-secret"
