management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith,metrics

spring:
  jpa:
    open-in-view: false

idem:
  # Non-blank test-only values so @NotBlank constraints (AuditProperties,
  # ChainWebhookSecurityValidator) don't fail context startup in @SpringBootTest suites.
  # AlchemyWebhookIntegrationTest overrides alchemy-webhook-signing-key via @TestPropertySource.
  audit:
    hmac-secret: "test-only-insecure-hmac-secret"
  chain:
    alchemy-webhook-signing-key: "test-only-insecure-alchemy-key"
    quicknode-webhook-secret: "test-only-insecure-quicknode-secret"
